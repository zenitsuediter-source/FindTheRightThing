<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script>
/* Apply the saved theme before paint to avoid a flash. Default: dark. */
(function () {
  try {
    var t = localStorage.getItem('ftrt_theme');
    t = t ? JSON.parse(t) : 'dark';
    if (['black', 'dark', 'light'].indexOf(t) === -1) t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FindTheRightThing — stop searching, start finding</title>
<meta name="description" content="FindTheRightThing helps you find the right website, tool, resource or solution for what you need. Describe your goal in plain words and get verified options.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f5bea'/><text x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>F</text></svg>">
<style>
/* FindTheRightThing — minimal, light/dark/black themes, one accent colour. */

/* ---------- Theme tokens ---------- */
:root,
[data-theme="dark"] {
  --bg: #17181d;
  --bg-soft: #1e2027;
  --panel: #1e2027;
  --panel-2: #24262e;
  --text: #e9eaee;
  --muted: #a3a9b5;
  --faint: #7e8592;
  --line: #2b2e37;
  --line-strong: #3a3e49;
  --accent: #6f8dff;
  --accent-dark: #93a8ff;
  --accent-soft: #1f2740;
  --on-accent: #0c1020;
  --header-bg: rgba(23, 24, 29, .9);
  --btn-bg: #24262e;
  --good: #5fd39a;
  --good-soft: #132a20;
  --warn: #e0b062;
  --warn-soft: #2d2413;
  --paid: #f0916b;
  --paid-soft: #2d1a12;
  --toast-bg: #e9eaee;
  --toast-fg: #14161a;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
  --shadow-hover: 0 2px 6px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45);
}
[data-theme="black"] {
  --bg: #000000;
  --bg-soft: #0b0c0f;
  --panel: #0d0e11;
  --panel-2: #121317;
  --text: #f1f2f4;
  --muted: #9aa1ad;
  --faint: #767d89;
  --line: #1d1f24;
  --line-strong: #2a2d34;
  --accent: #7c97ff;
  --accent-dark: #9db0ff;
  --accent-soft: #141a2c;
  --on-accent: #05070f;
  --header-bg: rgba(0, 0, 0, .85);
  --btn-bg: #121317;
  --good: #63d9a0;
  --good-soft: #0c2318;
  --warn: #e4b566;
  --warn-soft: #241c0e;
  --paid: #f3966f;
  --paid-soft: #241209;
  --toast-bg: #f1f2f4;
  --toast-fg: #000000;
  --shadow: 0 1px 2px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.6);
  --shadow-hover: 0 2px 6px rgba(0,0,0,.7), 0 12px 30px rgba(0,0,0,.7);
}
[data-theme="light"] {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #fcfcfd;
  --text: #14161a;
  --muted: #5c6370;
  --faint: #8b9199;
  --line: #e6e8ec;
  --line-strong: #d3d7dd;
  --accent: #2f5bea;
  --accent-dark: #1f43bd;
  --accent-soft: #edf1ff;
  --on-accent: #ffffff;
  --header-bg: rgba(255, 255, 255, .92);
  --btn-bg: #ffffff;
  --good: #1f7a4d;
  --good-soft: #e9f6ee;
  --warn: #8a5a00;
  --warn-soft: #fdf3e3;
  --paid: #8a3b12;
  --paid-soft: #fbeee8;
  --toast-bg: #14161a;
  --toast-fg: #ffffff;
  --shadow: 0 1px 2px rgba(20,22,26,.04), 0 6px 18px rgba(20,22,26,.05);
  --shadow-hover: 0 2px 4px rgba(20,22,26,.05), 0 10px 26px rgba(20,22,26,.09);
}

:root {
  --radius: 10px;
  --radius-sm: 7px;
  --maxw: 1120px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { color-scheme: dark; }
[data-theme="light"] { color-scheme: light; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  transition: background .2s ease, color .2s ease;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5rem; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0 0 .75rem; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.tiny { font-size: 12px; }
.hidden { display: none !important; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--header-bg);
  backdrop-filter: saturate(180%) blur(8px);
  border-bottom: 1px solid var(--line);
}
.header-inner { display: flex; align-items: center; gap: 12px; height: 62px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; color: var(--text); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-size: 14px; font-weight: 800;
}
.nav { display: flex; align-items: center; gap: 2px; margin-left: 6px; flex-wrap: wrap; }
.nav a {
  color: var(--muted); font-size: 14.5px; padding: 7px 11px; border-radius: var(--radius-sm);
  transition: background .15s ease, color .15s ease;
}
.nav a:hover { background: var(--bg-soft); color: var(--text); text-decoration: none; }
.nav a.active { color: var(--text); background: var(--accent-soft); font-weight: 600; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.count-pill {
  font-size: 12.5px; background: var(--accent-soft); color: var(--accent-dark);
  padding: 5px 10px; border-radius: 999px; font-weight: 600; white-space: nowrap;
}
.count-pill:hover { text-decoration: none; }
.menu-toggle { display: none; background: none; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 16px; cursor: pointer; color: var(--text); }
.theme-switch { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.theme-switch button {
  background: var(--btn-bg); color: var(--muted); border: 0; border-right: 1px solid var(--line);
  padding: 6px 9px; font-size: 13px; cursor: pointer; font-family: inherit; line-height: 1; transition: background .15s ease, color .15s ease;
}
.theme-switch button:last-child { border-right: 0; }
.theme-switch button:hover { color: var(--text); }
.theme-switch button.active { background: var(--accent); color: var(--on-accent); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line-strong); background: var(--btn-bg); color: var(--text);
  padding: 9px 15px; border-radius: var(--radius-sm); font-size: 14.5px; font-weight: 550;
  cursor: pointer; font-family: inherit; white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, transform .12s ease, box-shadow .15s ease;
}
.btn:hover { background: var(--bg-soft); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-lg { padding: 13px 22px; font-size: 16px; border-radius: 9px; }
.btn-sm { padding: 6px 11px; font-size: 13px; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--bg-soft); color: var(--text); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link-arrow { font-weight: 600; font-size: 14px; }

/* ---------- Hero ---------- */
.hero { padding: 54px 0 14px; }
.hero h1 { font-size: 34px; margin-bottom: 6px; }
.hero .tagline { color: var(--muted); font-size: 17px; margin-bottom: 30px; }
.hero .ask { font-size: 19px; font-weight: 600; margin-bottom: 12px; }

/* ---------- Search bar (prefix is in normal flow, so it can never overlap) ---------- */
.searchbar { display: flex; gap: 10px; max-width: 760px; width: 100%; }
.searchbar.wide { max-width: none; }
.input-wrap {
  display: flex; align-items: center; flex: 1; min-width: 0;
  border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel);
  padding: 0 6px 0 14px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-wrap .prefix {
  color: var(--faint); font-size: 15.5px; white-space: nowrap; flex: none;
  padding-right: 10px; margin-right: 10px; border-right: 1px solid var(--line);
}
.input-wrap input[type="text"] {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text);
  padding: 15px 6px 15px 0; font-size: 16px; font-family: inherit;
}
.input-wrap input[type="text"]:focus { outline: none; box-shadow: none; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; max-width: 800px; }
.example-chip {
  font-size: 13.5px; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line);
  padding: 7px 13px; border-radius: 999px; cursor: pointer; font-family: inherit;
  transition: all .15s ease;
}
.example-chip:hover { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-soft); }
.section { padding: 34px 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.section-head h2 { font-size: 21px; margin: 0; }
.section-head .muted { font-size: 14px; }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* ---------- Category grid ---------- */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.cat-card {
  border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; background: var(--panel);
  color: var(--text); transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.cat-card:hover { text-decoration: none; border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.cat-card .emoji { font-size: 21px; display: block; margin-bottom: 8px; }
.cat-card .name { font-weight: 600; font-size: 15px; display: block; }
.cat-card .n { color: var(--faint); font-size: 12.5px; }

/* ---------- Cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card {
  border: 1px solid var(--line); border-radius: var(--radius); padding: 17px; background: var(--panel);
  display: flex; flex-direction: column; gap: 9px;
  transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card .name { font-size: 16px; font-weight: 650; margin: 0; }
.card .name a { color: var(--text); }
.card .desc { color: var(--muted); font-size: 14px; margin: 0; }
.card .why { font-size: 13.5px; color: var(--text); background: var(--bg-soft); border-left: 3px solid var(--accent); padding: 8px 11px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 0; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.card .meta b { color: var(--text); font-weight: 600; }
.card .foot { margin-top: auto; display: flex; gap: 8px; align-items: center; padding-top: 4px; flex-wrap: wrap; }

/* ---------- Badges & tags ---------- */
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge {
  font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 5px; white-space: nowrap;
}
.badge.award { background: var(--accent-soft); color: var(--accent-dark); }
.badge.price-Free { background: var(--good-soft); color: var(--good); }
.badge.price-FreeTier { background: var(--warn-soft); color: var(--warn); }
.badge.price-Paid { background: var(--paid-soft); color: var(--paid); }
.tag {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line);
  padding: 2px 6px; border-radius: 4px;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Search layout + filters ---------- */
.search-layout { display: grid; grid-template-columns: 236px 1fr; gap: 26px; align-items: start; }
.filters { position: sticky; top: 78px; }
.filter-block { border-bottom: 1px solid var(--line); padding: 14px 0; }
.filter-block:first-child { padding-top: 0; }
.filter-block h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin: 0 0 9px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); padding: 3px 0; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
.check:hover { color: var(--text); }
.filter-actions { padding-top: 14px; }

/* ---------- Results ---------- */
.results-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.results-head h1 { font-size: 21px; margin: 0; }
.results-head h1 .q { color: var(--accent-dark); }
.notice {
  display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border: 1px solid var(--line);
  color: var(--text); border-radius: var(--radius); padding: 13px 15px; font-size: 14px; margin-bottom: 18px;
}
.notice .ic { font-size: 17px; line-height: 1.3; }
.notice strong { display: block; margin-bottom: 3px; }
.solution-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.solution-chips button {
  font-size: 13.5px; border: 1px solid var(--line-strong); background: var(--btn-bg); color: var(--text);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: inherit;
}
.solution-chips button:hover { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }

/* ---------- Empty state ---------- */
.empty { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 36px 24px; text-align: center; background: var(--bg-soft); }
.empty h3 { font-size: 19px; margin-bottom: 6px; }
.empty p { color: var(--muted); }
.empty .examples { justify-content: center; margin: 18px auto 0; }

/* ---------- Active filter chips ---------- */
.active-filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  background: var(--accent-soft); color: var(--accent-dark); border-radius: 999px; padding: 4px 8px 4px 11px;
}
.chip button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }

/* ---------- Detail page ---------- */
.detail { display: grid; grid-template-columns: 1fr 300px; gap: 30px; align-items: start; padding: 30px 0 50px; }
.detail h1 { font-size: 28px; margin-bottom: 6px; }
.detail .sub { color: var(--muted); font-size: 16px; margin-bottom: 16px; }
.panel { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 17px; background: var(--bg-soft); }
.panel h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin: 0 0 9px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 5px 10px; font-size: 14px; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.block { margin-top: 26px; }
.block h3 { font-size: 17px; }
.ul { margin: 0; padding-left: 20px; }
.ul li { margin-bottom: 6px; }
.ul.pro li::marker { color: var(--good); }
.ul.con li::marker { color: var(--paid); }
.alt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.alt { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 13px; background: var(--panel); transition: border-color .15s ease; display: block; }
.alt:hover { border-color: var(--accent); text-decoration: none; }
.alt .name { font-weight: 600; color: var(--text); font-size: 14.5px; }
.alt .d { color: var(--muted); font-size: 12.5px; }

/* ---------- Compare table ---------- */
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table.cmp { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
table.cmp th, table.cmp td { border-bottom: 1px solid var(--line); padding: 11px 14px; text-align: left; vertical-align: top; }
table.cmp thead th { background: var(--bg-soft); font-size: 14.5px; }
table.cmp tbody th { color: var(--muted); font-weight: 500; width: 180px; background: var(--panel-2); }
table.cmp td .yes { color: var(--good); font-weight: 700; }
table.cmp td .no { color: var(--faint); }
table.cmp tr:last-child th, table.cmp tr:last-child td { border-bottom: 0; }

/* ---------- Questionnaire ---------- */
.q-wrap { max-width: 680px; margin: 0 auto; padding: 34px 0 60px; }
.q-progress { display: flex; gap: 6px; margin-bottom: 24px; }
.q-progress span { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.q-progress span.on { background: var(--accent); }
.q-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); }
.q-card h2 { font-size: 22px; margin-bottom: 4px; }
.q-hint { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.choice {
  display: flex; align-items: center; gap: 11px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  padding: 13px 15px; margin-bottom: 9px; cursor: pointer; font-size: 15px; background: var(--btn-bg);
  transition: border-color .14s ease, background .14s ease;
}
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice input { accent-color: var(--accent); width: 17px; height: 17px; flex: none; }
.q-nav { display: flex; justify-content: space-between; margin-top: 22px; gap: 10px; }
input[type="text"], input[type="url"], textarea, select {
  width: 100%; padding: 11px 13px; font-size: 15px; font-family: inherit; color: var(--text);
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--btn-bg);
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 92px; resize: vertical; }
label.field { display: block; margin-bottom: 15px; }
label.field > span { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
label.field .hint { font-weight: 400; color: var(--faint); font-size: 12.5px; }

/* ---------- Forms ---------- */
.form-narrow { max-width: 620px; }
.success { background: var(--good-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; color: var(--good); font-size: 14.5px; }

/* ---------- About ---------- */
.prose { max-width: 720px; }
.prose h2 { font-size: 20px; margin-top: 30px; }
.prose ul { padding-left: 20px; }
.prose li { margin-bottom: 7px; }
.callout { border-left: 3px solid var(--accent); background: var(--bg-soft); padding: 14px 17px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 20px 0; font-size: 15px; }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--line); margin-top: 40px; padding: 26px 0 40px; color: var(--muted); font-size: 13.5px; }
.footer-inner { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.site-footer a { color: var(--muted); }
.site-footer a:hover { color: var(--text); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
  background: var(--toast-bg); color: var(--toast-fg); padding: 11px 18px; border-radius: 8px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; z-index: 300;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- AI helper ---------- */
.ai-fab {
  position: fixed; right: 20px; bottom: 20px; z-index: 150;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px;
  padding: 12px 18px; font-family: inherit; font-size: 14.5px; font-weight: 650; cursor: pointer;
  box-shadow: var(--shadow-hover); transition: transform .15s ease, background .15s ease;
}
.ai-fab:hover { transform: translateY(-2px); background: var(--accent-dark); }
.ai-panel {
  position: fixed; right: 20px; bottom: 82px; z-index: 160;
  width: min(390px, calc(100vw - 32px)); max-height: min(580px, 74vh);
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px;
  box-shadow: var(--shadow-hover); display: flex; flex-direction: column; overflow: hidden;
  animation: fadeUp .2s ease both;
}
.ai-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ai-head strong { font-size: 14.5px; }
.ai-head .ai-close { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px; }
.ai-head .ai-close:hover { color: var(--text); }
.ai-body { padding: 14px; overflow-y: auto; flex: 1; font-size: 14.5px; }
.ai-msg { margin-bottom: 12px; max-width: 92%; }
.ai-msg.ai { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; padding: 10px 12px; }
.ai-msg.user { margin-left: auto; background: var(--accent-soft); color: var(--text); border-radius: 12px 12px 4px 12px; padding: 9px 12px; width: fit-content; }
.ai-msg p { margin: 0 0 8px; }
.ai-msg p:last-child { margin-bottom: 0; }
.ai-msg ul { margin: 0 0 8px; padding-left: 18px; }
.ai-msg li { margin-bottom: 6px; }
.ai-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.ai-chips button {
  font-size: 12.5px; border: 1px solid var(--line-strong); background: var(--btn-bg); color: var(--muted);
  padding: 5px 10px; border-radius: 999px; cursor: pointer; font-family: inherit;
}
.ai-chips button:hover { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }
.ai-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.ai-form input[type="text"] { flex: 1; min-width: 0; padding: 9px 11px; font-size: 14px; }

/* ---------- Reveal animation ---------- */
.reveal { animation: fadeUp .28s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Responsive ---------- */
@media (max-width: 1020px) {
  .nav a { padding: 7px 8px; font-size: 14px; }
}
@media (max-width: 980px) {
  .header-inner { height: auto; min-height: 62px; padding-top: 8px; padding-bottom: 8px; flex-wrap: wrap; }
  .detail { grid-template-columns: 1fr; }
  .search-layout { grid-template-columns: 1fr; }
  .filters { position: static; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--bg-soft); }
  .nav { display: none; order: 4; width: 100%; margin-left: 0; }
  .nav.open { display: flex; flex-direction: column; align-items: stretch; border-top: 1px solid var(--line); padding: 8px 0 4px; }
  .menu-toggle { display: inline-block; }
  .hero { padding-top: 36px; }
  .hero h1 { font-size: 28px; }
  .searchbar { flex-direction: column; }
  .searchbar .btn { width: 100%; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 14px; }
  .cat-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .grid { grid-template-columns: 1fr; }

  .ai-fab { padding: 14px; }

  .kv { grid-template-columns: 84px 1fr; }
}

<script>
/* FindTheRightThing — application logic.
   Hash-based routing, natural-language search, filters, recommendation flows. */
(function () {
  'use strict';
  const D = window.FTRT_DATA;
  const RES = D.RESOURCES;
  const BY_ID = {};
  RES.forEach(function (r) { BY_ID[r.id] = r; });
  const CAT_BY_ID = {};
  D.CATEGORIES.forEach(function (c) { CAT_BY_ID[c.id] = c; });

  /* ---------------- storage (no account required) ---------------- */
  const LS = {
    get: function (k, fallback) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const store = {
    saved: LS.get('ftrt_saved', []),
    compare: LS.get('ftrt_compare', []),
    suggestions: LS.get('ftrt_suggestions', [])
  };
  function saveSaved() {
    LS.set('ftrt_saved', store.saved);
    const p = document.getElementById('saved-pill');
    if (p) { p.textContent = store.saved.length + ' saved'; p.classList.toggle('hidden', store.saved.length === 0); }
    const s = document.getElementById('nav-saved-count');
    if (s) s.textContent = store.saved.length ? ' (' + store.saved.length + ')' : '';
  }
  function saveCompare() {
    LS.set('ftrt_compare', store.compare);
    const p = document.getElementById('compare-pill');
    if (p) { p.textContent = 'Compare (' + store.compare.length + ')'; p.classList.toggle('hidden', store.compare.length === 0); }
  }
  function isSaved(id) { return store.saved.indexOf(id) !== -1; }
  function toggleSaved(id) {
    const i = store.saved.indexOf(id);
    if (i === -1) { store.saved.push(id); toast('Saved to your list'); }
    else { store.saved.splice(i, 1); toast('Removed from saved'); }
    saveSaved();
  }
  function inCompare(id) { return store.compare.indexOf(id) !== -1; }
  function toggleCompare(id) {
    const i = store.compare.indexOf(id);

      if (store.compare.length >= 4) { toast('You can compare up to 4 resources'); return false; }
      store.compare.push(id);
    } else { store.compare.splice(i, 1); }
    saveCompare();
    return true;
  }

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function priceClass(p) { return 'price-' + p.replace(/\s+/g, ''); }
  function catName(id) { return CAT_BY_ID[id] ? CAT_BY_ID[id].name : id; }
  function catEmoji(id) { return CAT_BY_ID[id] ? CAT_BY_ID[id].emoji : '•'; }
  function owner(r) { try { return new URL(r.url).hostname.replace(/^www\./, ''); } catch (e) { return r.url; } }
  function qs(params) {
    const p = new URLSearchParams();
    Object.keys(params).forEach(function (k) {
      if (params[k] !== '' && params[k] != null && params[k] !== undefined) p.set(k, params[k]);
    });
    const s = p.toString();
    return s ? '?' + s : '';
  }
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
  let toastTimer;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  /* ---------------- theme (Black / Dark / Light) ---------------- */
  const THEMES = ['black', 'dark', 'light'];
  function currentTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    return THEMES.indexOf(t) !== -1 ? t : 'dark';
  }
  function applyTheme(t) {
    if (THEMES.indexOf(t) === -1) t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
    LS.set('ftrt_theme', t);
  }

  /* ---------------- natural-language understanding ---------------- */
  const STOP = new Set(['i', 'need', 'to', 'a', 'an', 'the', 'for', 'my', 'me', 'something', 'that', 'can',
    'help', 'with', 'how', 'do', 'you', 'want', 'trying', 'looking', 'please', 'some', 'any', 'get',
    'find', 'make', 'using', 'use', 'about', 'of', 'on', 'in', 'and', 'or', 'is', 'are', 'it', 'am',
    'what', 'which', 'would', 'should', 'like', 'there', 'good', 'thing', 'things']);
  function tokenize(q) {
    const raw = String(q).toLowerCase().replace(/[^a-z0-9+#\s]/g, ' ').split(/\s+/);
    const out = [];
    raw.forEach(function (t) {
      if (t.length < 2 || STOP.has(t)) return;
      out.push(t);
      if (t.length > 3 && t.endsWith('s') && !t.endsWith('ss')) out.push(t.slice(0, -1));
    });
    return out;
  }

  /* Intent phrases map a goal in plain words to topic tokens + a category. */
  const INTENTS = [
    { k: ['edit a video', 'edit video', 'video editing', 'video editor', 'cut video', 'make a video', 'youtube video', 'video for free'], t: ['video', 'editor', 'editing'], cat: 'video' },

    { k: ['study for', 'exam', 'test', 'memorize', 'memorise', 'flashcards', 'revision', 'revise'], t: ['study', 'flashcards', 'quiz', 'exam'], cat: 'education' },
    { k: ['learn coding', 'learn to code', 'learn programming', 'coding', 'programming', 'software developer', 'learn python', 'learn javascript'], t: ['programming', 'coding', 'learn'], cat: 'programming' },
    { k: ['presentation', 'slides', 'slide deck', 'powerpoint', 'keynote'], t: ['presentation', 'slides', 'template', 'icons'], cat: 'design' },
    { k: ['organize my life', 'organise my life', 'to do list', 'todo', 'task', 'tasks', 'planner', 'get organized'], t: ['task', 'productivity', 'organize', 'planner'], cat: 'productivity' },
    { k: ['find a job', 'job search', 'resume', 'cv', 'hiring', 'get hired', 'career'], t: ['job', 'resume', 'career', 'hiring'], cat: 'career' },
    { k: ['make a website', 'build a website', 'website', 'web page', 'webpage', 'portfolio site', 'blog'], t: ['website', 'web', 'site', 'blog'], cat: 'web' },
    { k: ['too many files', 'organize files', 'organise files', 'duplicate files', 'file organization', 'disk space', 'clean up my computer', 'messy files'], t: ['files', 'organize', 'duplicate', 'storage', 'backup'], cat: 'software' },
    { k: ['notes', 'note taking', 'note-taking', 'write notes', 'take notes'], t: ['notes', 'note-taking', 'notebook'], cat: 'productivity' },
    { k: ['free software', 'free programs', 'open source', 'free app'], t: ['free', 'software', 'open source'], cat: 'software' },
    { k: ['learn something', 'learn a new', 'course', 'tutorial', 'self study'], t: ['learn', 'course', 'learning'], cat: 'learning' },
    { k: ['budget', 'money', 'finance', 'expenses', 'save money', 'savings', 'invest'], t: ['finance', 'budget', 'money'], cat: 'finance' },
    { k: ['accessibility', 'screen reader', 'blind', 'low vision', 'disability', 'deaf'], t: ['accessibility'], cat: 'accessibility' },
    { k: ['write an essay', 'essay', 'writing', 'proofread', 'grammar', 'paper'], t: ['writing', 'grammar', 'essay'], cat: 'writing' },
    { k: ['music', 'song', 'beat', 'record audio', 'podcast', 'audio'], t: ['audio', 'music', 'podcast'], cat: 'audio' },
    { k: ['design a logo', 'logo', 'graphic', 'poster', 'flyer', 'social media post'], t: ['design', 'logo', 'graphic'], cat: 'design' },
    { k: ['calendar', 'schedule', 'booking', 'reminder'], t: ['calendar', 'schedule', 'organize'], cat: 'organization' },
    { k: ['bookmark', 'save links', 'read later', 'links'], t: ['bookmarks', 'save links', 'organize'], cat: 'organization' }
  ];
  function matchIntents(q) {
    const s = ' ' + String(q).toLowerCase() + ' ';
    return INTENTS.filter(function (it) {
      return it.k.some(function (k) { return s.indexOf(k) !== -1; });
    });
  }

  /* Problem -> possible solution types (the "I don't know what I need" feature). */
  const SOLUTIONS = [
    { re: /(too many files|organi[sz]e.*files|messy files|clutter|duplicate files|disk space|clean up.*(computer|pc)|storage full)/,
      types: ['File organization tools', 'Cloud storage', 'Duplicate-file finders', 'File search utilities'],
      searches: ['organize files', 'cloud storage', 'find duplicate files', 'search files fast'] },
    { re: /(procrastinat|can.?t focus|cannot focus|distract|concentrate|time management)/,
      types: ['Focus timers', 'Task managers', 'Daily planners'],
      searches: ['focus timer', 'task manager', 'daily planner'] },
    { re: /(can.?t remember|forget everything|memoriz|memoris|remember what i|revision)/,
      types: ['Spaced-repetition flashcards', 'Note-taking apps', 'Study planners'],
      searches: ['flashcards', 'note taking', 'study planner'] },
    { re: /(picture|photo).*(crop|edit|background|retouch)|remove.*background|edit.*photo/,
      types: ['Photo editors', 'Background removers', 'Browser-based editors'],
      searches: ['remove background', 'photo editing', 'edit image in browser'] },
    { re: /(lose|lost|back up|backup|delete).*(photos|files|documents)|data loss/,
      types: ['Backup software', 'Cloud storage', 'File organisers'],
      searches: ['backup software', 'cloud storage', 'organize files'] },
    { re: /(learn|study|teach myself).*(code|coding|program|python|web)/,
      types: ['Free coding curricula', 'Interactive courses', 'Documentation references'],
      searches: ['learn coding', 'interactive coding course', 'programming documentation'] },
    { re: /(write|writing|essay|grammar|awkward sentences|proofread)/,
      types: ['Writing assistants', 'Grammar checkers', 'Reference managers'],
      searches: ['grammar checker', 'writing clarity', 'citation manager'] },
    { re: /(money|budget|spending|expenses|savings|debt|finance)/,
      types: ['Budgeting apps', 'Expense trackers', 'Financial comparison sites'],
      searches: ['budget', 'track spending', 'compare financial products'] },
    { re: /(job|hired|resume|cv|interview|career|salary)/,
      types: ['Job boards', 'Resume builders', 'Salary and company research'],
      searches: ['job board', 'resume builder', 'company reviews salary'] },
    { re: /(video|film|youtube|editing clips|movie)/,
      types: ['Video editors', 'Video converters', 'Screen recorders'],
      searches: ['video editor', 'convert video', 'screen recording'] }
  ];
  function solutionTypes(q) {
    const s = String(q).toLowerCase();
    const found = { types: [], searches: [] };
    SOLUTIONS.forEach(function (rule) {
      if (rule.re.test(s)) {
        rule.types.forEach(function (t) { if (found.types.indexOf(t) === -1) found.types.push(t); });
        rule.searches.forEach(function (t) { if (found.searches.indexOf(t) === -1) found.searches.push(t); });
      }
    });
    return found;
  }

  /* ---------------- search engine ---------------- */
  function scoreResource(r, query) {
    const q = String(query).trim().toLowerCase();
    const tokens = tokenize(q);
    const intents = matchIntents(q);
    const extra = [];
    intents.forEach(function (it) { extra.push.apply(extra, it.t); });
    const all = [];
    tokens.concat(extra).forEach(function (t) { if (all.indexOf(t) === -1) all.push(t); });

    const name = r.name.toLowerCase();
    const tagStr = r.tags.join(' ').toLowerCase();
    const catStr = (r.category + ' ' + catName(r.category) + ' ' + r.subcategories.join(' ')).toLowerCase();
    const bodyStr = (r.description + ' ' + r.best_for + ' ' + r.advantages.join(' ') + ' ' + r.disadvantages.join(' ')).toLowerCase();

    let score = 0;
    all.forEach(function (t) {
      if (name.indexOf(t) !== -1) score += 7;
      if (tagStr.indexOf(t) !== -1) score += 4;
      if (catStr.indexOf(t) !== -1) score += 3;
      if (bodyStr.indexOf(t) !== -1) score += 1;
    });
    intents.forEach(function (it) { if (r.category === it.cat) score += 5; });
    if (q && name.indexOf(q) !== -1) score += 9;
    if (q && tagStr.indexOf(q) !== -1) score += 4;

    if (/\bfree\b/.test(q)) {
      if (r.price === 'Free') score += 7;
      else if (r.price === 'Free tier') score += 4;
      else score -= 2;
    }
    if (/\b(beginner|easy|simple|new)\b/.test(q) && r.difficulty === 'Beginner') score += 4;
    if (/\b(advanced|professional|pro|powerful)\b/.test(q) && r.difficulty === 'Advanced') score += 4;
    if (/\b(no install|browser|online|without download)\b/.test(q) && r.platforms.indexOf('Web') !== -1) score += 4;
    if (/\b(phone|mobile|android|iphone)\b/.test(q) && (r.platforms.indexOf('Android') !== -1 || r.platforms.indexOf('iPhone') !== -1)) score += 4;
    if (/\b(mac|macbook)\b/.test(q) && r.platforms.indexOf('Mac') !== -1) score += 3;
    if (/\b(windows|pc)\b/.test(q) && r.platforms.indexOf('Windows') !== -1) score += 3;
    if (/\b(privacy|private|offline|encrypt)\b/.test(q) && /(private|privacy|offline|encrypt|open source)/.test(tagStr + bodyStr)) score += 4;

    // small baseline so every result has a reason to be ranked
    if (score > 0) score += r.awards.length * 0.5;
    return score;
  }

  function applyFilters(list, f) {
    return list.filter(function (r) {
      if (f.cats.length && f.cats.indexOf(r.category) === -1) return false;
      if (f.prices.length && f.prices.indexOf(r.price) === -1) return false;
      if (f.diffs.length && f.diffs.indexOf(r.difficulty) === -1) return false;
      if (f.plats.length && !f.plats.some(function (p) { return r.platforms.indexOf(p) !== -1; })) return false;
      return true;
    });
  }

  function search(query, f) {
    const q = String(query || '').trim();
    let scored;
    if (!q) {
      scored = RES.map(function (r) { return { r: r, score: 1 }; });
    } else {
      scored = RES.map(function (r) { return { r: r, score: scoreResource(r, q) }; })
        .filter(function (x) { return x.score > 1.5; });
    }
    scored = scored.filter(function (x) { return applyFilters([x.r], f).length === 1; });
    const sort = f.sort || 'match';
    scored.sort(function (a, b) {
      if (sort === 'name') return a.r.name.localeCompare(b.r.name);
      if (sort === 'free') {
        const rank = { 'Free': 0, 'Free tier': 1, 'Paid': 2 };
        const d = rank[a.r.price] - rank[b.r.price];
        if (d) return d;
      }
      return b.score - a.score || a.r.name.localeCompare(b.r.name);
    });
    return scored;
  }

  /* ---------------- view fragments ---------------- */
  function badgeAwards(r) {

  function catGrid(list) {

      return '<a class="cat-card" href="#/category/' + c.id + '">' +
        '<span class="emoji">' + c.emoji + '</span>' +
        '<span class="name">' + esc(c.name) + '</span>' +

  function parseMult(params, key) {

    } else {
      body = '<div class="grid">' + results.map(function (x, i) { return resultCard(x.r, i); }).join('') + '</div>';

    const active = renderActiveFilters(f);
    return '' +
      '<section class="wrap section">' +
        '<div class="results-head"><div>' + head + '</div>' + count + '</div>' +
        (q ? '' : '') +
        notice +
        '<form class="searchbar wide" data-form="search" style="margin-bottom:20px">' +

  function renderActiveFilters(f) {

  const CHOOSE = {
    step: 0,
    goal: '',
    priorities: [],
    experience: '',
    reset: function () { this.step = 0; this.goal = ''; this.priorities = []; this.experience = ''; }
  };
  const PRIORITIES = ['Completely free', 'Easy to use', 'Best quality', 'No download', 'Works on phone', 'Works on PC', 'Privacy', 'Fast'];
  const EXPERIENCE = ['I\u2019m completely new', 'I know the basics', 'I\u2019m experienced'];

  function viewChoose() {
    const p = CHOOSE;
    if (p.step > 2) return chooseResults();
    const bars = '<div class="q-progress">' + [0, 1, 2].map(function (i) {
      return '<span class="' + (i <= p.step ? 'on' : '') + '"></span>';
    }).join('') + '</div>';

    if (p.step === 0) {

        EXPERIENCE.map(function (x) {

        }).join('') +

        '<button class="btn btn-primary" data-action="choose-next">Show my matches</button></div>';
    }
    return '<section class="q-wrap"><div class="q-card">' + bars + inner + '</div></section>';
  }

  function chooseResults() {
    const f = { cats: [], prices: [], plats: [], diffs: [], sort: 'match' };
    const base = search(CHOOSE.goal, f).slice(0, 24);
    const pr = CHOOSE.priorities;
    const scored = base.map(function (x) {
      let s = x.score;
      if (pr.indexOf('Completely free') !== -1) s += (x.r.price === 'Free' ? 8 : x.r.price === 'Free tier' ? 3 : -6);
      if (pr.indexOf('Easy to use') !== -1) s += (x.r.difficulty === 'Beginner' ? 6 : 0);
      if (pr.indexOf('Best quality') !== -1) s += (x.r.awards.indexOf('Best overall') !== -1 ? 6 : 0) + (x.r.difficulty === 'Advanced' ? 1 : 0);
      if (pr.indexOf('No download') !== -1) s += (x.r.platforms.indexOf('Web') !== -1 ? 7 : -3);
      if (pr.indexOf('Works on phone') !== -1) s += ((x.r.platforms.indexOf('Android') !== -1 || x.r.platforms.indexOf('iPhone') !== -1) ? 6 : -2);
      if (pr.indexOf('Works on PC') !== -1) s += ((x.r.platforms.indexOf('Windows') !== -1 || x.r.platforms.indexOf('Mac') !== -1) ? 5 : -2);
      if (pr.indexOf('Privacy') !== -1) s += (/(private|privacy|offline|encrypt|open source)/.test(x.r.tags.join(' ')) ? 7 : 0);
      if (pr.indexOf('Fast') !== -1) s += (/(fast|quick|instant|simple)/.test(x.r.tags.join(' ') + x.r.description.toLowerCase()) ? 5 : 0);
      if (CHOOSE.experience === EXPERIENCE[0]) s += (x.r.difficulty === 'Beginner' ? 5 : x.r.difficulty === 'Advanced' ? -5 : 0);
      if (CHOOSE.experience === EXPERIENCE[1]) s += (x.r.difficulty === 'Advanced' ? -2 : 1);
      return { r: x.r, score: s };
    }).sort(function (a, b) { return b.score - a.score; }).slice(0, 9);

    if (!scored.length) {
      return '<section class="q-wrap"><div class="q-card"><h2>We need a little more to go on</h2>' +
        '<p class="q-hint">Try a slightly more specific goal, for example &ldquo;edit a video for social media&rdquo;.</p>' +
        '<div class="q-nav"><button class="btn" data-action="choose-restart">Start over</button>' +
        '<a class="btn btn-primary" href="#/search">Search instead</a></div></div></section>';
    }
    return '<section class="wrap section">' +
      '<div class="section-head"><div><h1 style="font-size:24px;margin:0">Best matches for you</h1>' +
        '<p class="muted small" style="margin:4px 0 0">Based on &ldquo;' + esc(CHOOSE.goal) + '&rdquo;' +
        (CHOOSE.priorities.length ? ' · ' + esc(CHOOSE.priorities.join(', ')) : '') + '</p></div>' +
        '<button class="btn btn-sm" data-action="choose-restart">Start over</button></div>' +
      '<div class="grid">' + scored.map(function (x, i) { return resultCard(x.r, i); }).join('') + '</div>' +
      '<p class="small muted" style="margin-top:18px">Not quite right? <a href="#/search?q=' + encodeURIComponent(CHOOSE.goal) + '">Open full results</a> and use the filters.</p>' +
      '</section>';
  }

  function route() {
    const raw = location.hash.replace(/^#/, '') || '/';
    const parts = raw.split('?');
    const path = parts[0];
    const params = new URLSearchParams(parts[1] || '');
    const seg = path.split('/').filter(Boolean);
    let html = '', active = '';

    if (seg.length === 0) { html = viewHome(); active = 'discover'; }
    else if (seg[0] === 'search') { html = viewSearch(params); active = 'discover'; }
    else if (seg[0] === 'categories') { html = viewCategories(); active = 'categories'; }
    else if (seg[0] === 'category') { html = viewCategory(seg[1]); active = 'categories'; }
    else if (seg[0] === 'resource') { html = viewResource(seg[1]); active = 'discover'; }
    else if (seg[0] === 'compare') { html = viewCompare(params); active = 'compare'; }
    else if (seg[0] === 'saved') { html = viewSaved(); active = 'saved'; }
    else if (seg[0] === 'choose') { html = viewChoose(); active = 'choose'; }
    else if (seg[0] === 'suggest') { html = viewSuggest(); active = 'suggest'; }
    else if (seg[0] === 'about') { html = viewAbout(); active = 'about'; }
    else { html = notFound(); }

    currentActive = active;
    document.getElementById('app').innerHTML = html;
    renderHeader();

    const footer = document.getElementById('footer-slot');
    if (footer) footer.innerHTML = '<div class="wrap footer-inner">' +
      '<div>FindTheRightThing — a free, curated directory. No account required.</div>' +
      '<div><a href="#/about">About &amp; transparency</a> · <a href="#/categories">Categories</a> · <a href="#/suggest">Suggest a resource</a></div>' +
      '</div>';

    // focus the search box when empty and it exists
    if (seg[0] === 'search' || seg.length === 0) {
      const qEl = document.getElementById(seg.length === 0 ? 'home-q' : 'top-q');
      if (qEl && !qEl.value) qEl.focus();
    }
    // keep compare/saved pills fresh
    saveSaved(); saveCompare();
  }

  function searchFromInput(value, mode) {
    const v = String(value || '').trim();
    go('#/search' + qs({ q: v, mode: mode || '' }));
  }
  function setFiltersFromDom() {
    const params = new URLSearchParams((location.hash.split('?')[1] || ''));
    const pick = function (group) {
      return Array.prototype.slice.call(document.querySelectorAll('[data-filter="' + group + '"]:checked')).map(function (el) { return el.value; });
    };
    params.set('price', pick('price').join(','));
    params.set('plat', pick('plat').join(','));
    params.set('diff', pick('diff').join(','));
    params.set('cat', pick('cat').join(','));
    const sortEl = document.getElementById('sort-select');
    if (sortEl) params.set('sort', sortEl.value);
    // clean empty
    Array.prototype.slice.call(params.keys()).forEach(function (k) { if (!params.get(k)) params.delete(k); });
    const query = params.get('q') || '';
    const s = params.toString();
    go('#/search' + (s ? '?' + s : ''));
    if (query) { /* keep */ }
  }

  document.addEventListener('click', function (e) {
    // Internal hash links are handled in JavaScript. If the page is served with a
    // host-injected <base href>, a plain href="#/page" would resolve to a full URL
    // and the browser would navigate away (showing an "Access denied" page).
    const a = e.target.closest('a[href]');
    if (a) {
      const href = a.getAttribute('href') || '';
      if (href.charAt(0) === '#') {
        e.preventDefault();
        const n = document.getElementById('main-nav'); if (n) n.classList.remove('open');
        if (href === (location.hash || '#/')) route(); else go(href);
        return;
      }
    }
    const t = e.target.closest('[data-action],[data-search],[data-search-mode],[data-theme-set],[data-ai-chip]');
    if (!t) return;
    if (t.hasAttribute('data-theme-set')) {
      e.preventDefault();
      applyTheme(t.getAttribute('data-theme-set'));
      renderHeader();
      return;
    }
    if (t.hasAttribute('data-ai-chip')) {
      e.preventDefault();
      aiSend(t.getAttribute('data-ai-chip'));
      return;
    }
    if (t.hasAttribute('data-search')) {
      e.preventDefault();
      searchFromInput(t.getAttribute('data-search'));
      return;
    }
    if (t.hasAttribute('data-search-mode')) {
      e.preventDefault();
      go('#/search?mode=' + t.getAttribute('data-search-mode'));
      return;
    }
    const action = t.getAttribute('data-action');
    if (action === 'save') {
      e.preventDefault();
      toggleSaved(t.getAttribute('data-id'));
      route();
    } else if (action === 'compare') {
      e.preventDefault();
      if (toggleCompare(t.getAttribute('data-id'))) route();
    } else if (action === 'clear-saved') {
      store.saved = []; saveSaved(); route(); toast('Saved list cleared');
    } else if (action === 'clear-compare') {
      store.compare = []; saveCompare(); go('#/compare');
    } else if (action === 'browse-all') {
      go('#/search' + qs({ sort: (document.getElementById('sort-select') || {}).value || '' }));
    } else if (action === 'clear-filters') {
      const h = location.hash.split('?');
      const q = new URLSearchParams(h[1] || '').get('q') || '';
      go('#/search' + qs({ q: q }));
    } else if (action === 'remove-filter') {
      const group = t.getAttribute('data-group');
      const value = t.getAttribute('data-value');
      const h = location.hash.split('?');
      const params = new URLSearchParams(h[1] || '');
      const mapKey = { price: 'price', plat: 'plat', diff: 'diff', cat: 'cat' }[group] || group;
      const cur = (params.get(mapKey) || '').split(',').filter(Boolean).filter(function (v) { return v !== value; });
      if (cur.length) params.set(mapKey, cur.join(',')); else params.delete(mapKey);
      go('#/search?' + params.toString());
    } else if (action === 'menu') {
      const n = document.getElementById('main-nav');
      if (n) n.classList.toggle('open');
    } else if (action === 'choose-next') {
      if (CHOOSE.step === 0) {
        const el = document.getElementById('choose-goal');
        CHOOSE.goal = el ? el.value.trim() : '';
        if (!CHOOSE.goal) { toast('Tell us what you want to accomplish'); return; }
      }
      if (CHOOSE.step === 2 && !CHOOSE.experience) { toast('Pick one option'); return; }
      CHOOSE.step++;
      route();
    } else if (action === 'choose-back') {
      if (CHOOSE.step > 0) CHOOSE.step--;
      route();
    } else if (action === 'choose-restart') {
      CHOOSE.reset(); go('#/choose');
    } else if (action === 'ai-toggle') {
      e.preventDefault();
      aiToggle();
    }
  });

  document.addEventListener('change', function (e) {
    const el = e.target;
    if (el.matches('[data-filter]')) { setFiltersFromDom(); return; }
    if (el.id === 'sort-select') { setFiltersFromDom(); return; }
    if (el.matches('[data-priority]')) {
      const v = el.getAttribute('data-priority');
      const i = CHOOSE.priorities.indexOf(v);
      if (el.checked && i === -1) CHOOSE.priorities.push(v);
      if (!el.checked && i !== -1) CHOOSE.priorities.splice(i, 1);
      return;
    }
    if (el.matches('[data-experience]')) { CHOOSE.experience = el.getAttribute('data-experience'); return; }
  });

  document.addEventListener('submit', function (e) {
    const form = e.target;
    if (form.matches('[data-form="search"]')) {
      e.preventDefault();
      const input = form.querySelector('input[type="text"]');
      searchFromInput(input ? input.value : '');
    } else if (form.id === 'ai-form') {
      e.preventDefault();
      const inp = document.getElementById('ai-input');
      aiSend(inp ? inp.value : '');
      if (inp) inp.value = '';
    } else if (form.id === 'suggest-form') {
      e.preventDefault();
      const data = {};
      Array.prototype.slice.call(form.elements).forEach(function (el) {
        if (el.name) data[el.name] = el.value.trim();
      });
      if (!/^https?:\/\//i.test(data.url || '')) { toast('Please enter a full URL starting with https://'); return; }
      data.submitted_at = new Date().toISOString();
      data.status = 'pending review';
      store.suggestions.push(data);
      LS.set('ftrt_suggestions', store.suggestions);
      form.reset();
      const box = document.getElementById('suggest-result');
      if (box) box.innerHTML = '<div class="success" style="margin-top:16px"><b>Thanks — your suggestion was added to the moderation queue.</b><br>' +
        'It will only appear on the site once the resource and its official website have been checked.</div>';
      toast('Suggestion submitted');
    }
  });

  /* ---------------- AI helper ---------------- */
  const AI = { open: false, seeded: false, msgs: [], chips: [] };
  const AI_STARTERS = ['edit a video for free', 'study for an exam', 'make a presentation', 'organize my files', 'learn to code', 'remove a background from a photo'];

  function aiToggle(force) {
    AI.open = typeof force === 'boolean' ? force : !AI.open;
    const panel = document.getElementById('ai-panel');
    if (!panel) return;
    panel.classList.toggle('hidden', !AI.open);
    if (AI.open) {
      if (!AI.seeded) {
        AI.seeded = true;
        AI.msgs.push({ who: 'ai', html: '<p>Hi — I\u2019m the FindTheRightThing helper. Tell me what you\u2019re trying to do in plain words and I\u2019ll suggest a few options.</p>' });
        AI.chips = AI_STARTERS;
      }
      const inp = document.getElementById('ai-input');
      if (inp) inp.focus();
      aiRender();
    }
  }
  function aiPush(who, html, chips) {
    AI.msgs.push({ who: who, html: html });
    if (chips) AI.chips = chips;
    aiRender();
  }
  function aiRender() {
    const body = document.getElementById('ai-body');
    const chipBox = document.getElementById('ai-chips');
    if (body) {
      body.innerHTML = AI.msgs.map(function (m) {
        return '<div class="ai-msg ' + m.who + '">' + m.html + '</div>';
      }).join('');
      body.scrollTop = body.scrollHeight;
    }
    if (chipBox) {
      chipBox.innerHTML = (AI.chips || []).map(function (c) {
        return '<button data-ai-chip="' + esc(c) + '">' + esc(c) + '</button>';
      }).join('');
    }
  }
  function aiAnswer(text) {
    const q = String(text).trim();
    const low = q.toLowerCase();
    if (/^(hi|hello|hey|yo|good (morning|evening|afternoon))\b/.test(low)) {
      return { html: '<p>Hello! What are you trying to do? For example: <em>\u201cI need to edit a video for free\u201d</em>.</p>', chips: AI_STARTERS };
    }
    if (/^(thanks|thank you|ty|cheers)\b/.test(low)) {
      return { html: '<p>Anytime. Describe another goal whenever you like.</p>', chips: AI_STARTERS };
    }
    if (/(help me choose|not sure|don\u2019t know|dont know|no idea)/.test(low)) {
      return { html: '<p>No problem — the guided version asks three quick questions and then recommends options.</p>' +
        '<p><a class="btn btn-sm btn-primary" href="#/choose">Open Help Me Choose</a></p>', chips: AI_STARTERS.slice(0, 3) };
    }
    const f = { cats: [], prices: [], plats: [], diffs: [], sort: 'match' };
    const results = search(q, f).slice(0, 3);
    const sol = solutionTypes(q);
    if (!results.length) {
      return { html: '<p>I couldn\u2019t match that to anything in my list yet. Try describing the goal rather than a tool name — for example <em>\u201cI need to study for a biology test\u201d</em> or <em>\u201cfree thing to remove backgrounds\u201d</em>.</p>', chips: AI_STARTERS };
    }
    let html = '';
    if (sol.types.length) {
      html += '<p>You might need: ' + sol.types.slice(0, 4).map(function (x) { return '<b>' + esc(x) + '</b>'; }).join(', ') + '.</p>';
    }
    html += '<p>Here ' + (results.length === 1 ? 'is what I would start with' : 'are ' + results.length + ' options I would start with') + ':</p>';
    html += '<ul>' + results.map(function (x) {
      return '<li><a href="#/resource/' + x.r.id + '"><b>' + esc(x.r.name) + '</b></a> — ' + esc(x.r.price) + ', ' +
        esc(x.r.difficulty) + '. ' + esc(x.r.best_for) + '</li>';
    }).join('') + '</ul>';
    html += '<p><a class="btn btn-sm btn-primary" href="#/search?q=' + encodeURIComponent(q) + '">See all matches</a> ' +
      '<a class="btn btn-sm" href="#/choose">Help me choose</a></p>';
    return { html: html, chips: sol.searches.length ? sol.searches.slice(0, 3) : AI_STARTERS.slice(0, 4) };
  }
  function aiSend(text) {
    const q = String(text || '').trim();
    if (!q) return;
    aiPush('user', esc(q));
    const a = aiAnswer(q);
    setTimeout(function () { aiPush('ai', a.html, a.chips); }, 160);
  }

  applyTheme(currentTheme());
  window.addEventListener('hashchange', route);
  document.addEventListener('DOMContentLoaded', route);
  if (document.readyState !== 'loading') route();
})();

</script>
</body>
</html>
